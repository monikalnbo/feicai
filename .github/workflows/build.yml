name: Build FeiCai

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Python deps
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --onedir \
            --name "FeiCai" \
            --add-data "VERSION:." \
            --add-data "web_dist:web_dist" \
            --add-data "modules:modules" \
            --hidden-import "desktop.server" \
            --hidden-import "desktop.logger" \
            --hidden-import "desktop.loader" \
            --hidden-import "desktop.update_checker" \
            --hidden-import "webview.platforms.gtk" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --collect-all "webview" \
            desktop/main.py
      - name: Package
        run: |
          cd dist
          zip -r FeiCai-linux.zip FeiCai/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeiCai-linux
          path: dist/FeiCai-linux.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --onedir \
            --windowed \
            --name "FeiCai" \
            --add-data "VERSION:." \
            --add-data "web_dist:web_dist" \
            --add-data "modules:modules" \
            --hidden-import "desktop.server" \
            --hidden-import "desktop.logger" \
            --hidden-import "desktop.loader" \
            --hidden-import "desktop.update_checker" \
            --hidden-import "webview.platforms.cocoa" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --collect-all "webview" \
            desktop/main.py
      - name: Package
        run: |
          cd dist
          zip -r FeiCai-mac.zip FeiCai.app/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeiCai-mac
          path: dist/FeiCai-mac.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        shell: pwsh
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --onedir `
            --windowed `
            --name "FeiCai" `
            --add-data "VERSION;." `
            --add-data "web_dist;web_dist" `
            --add-data "modules;modules" `
            --hidden-import desktop.server `
            --hidden-import desktop.logger `
            --hidden-import desktop.loader `
            --hidden-import desktop.update_checker `
            --hidden-import webview.platforms.win32 `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --collect-all webview `
            desktop/main.py
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist\FeiCai\* -DestinationPath dist\FeiCai-win.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeiCai-win
          path: dist/FeiCai-win.zip

  release:
    needs: [build-linux, build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FeiCai-linux
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: FeiCai-mac
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: FeiCai-win
          path: release/
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true