name: Build FeiCai

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Python deps
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --onefile \
            --name "FeiCai" \
            --add-data "VERSION:." \
            --add-data "web_dist:web_dist" \
            --add-data "modules:modules" \
            --hidden-import "desktop.server" \
            --hidden-import "desktop.logger" \
            --hidden-import "desktop.loader" \
            --hidden-import "desktop.update_checker" \
            --hidden-import "webview.platforms.gtk" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --collect-all "webview" \
            desktop/main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeiCai-linux
          path: dist/FeiCai

  build-mac-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller (ARM64)
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --target-arch arm64 \
            --name "FeiCai" \
            --add-data "VERSION:." \
            --add-data "web_dist:web_dist" \
            --add-data "modules:modules" \
            --hidden-import "desktop.server" \
            --hidden-import "desktop.logger" \
            --hidden-import "desktop.loader" \
            --hidden-import "desktop.update_checker" \
            --hidden-import "webview.platforms.cocoa" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --collect-all "webview" \
            desktop/main.py
      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeiCai-mac-arm64
          path: dist/FeiCai

  build-mac-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller (x86_64)
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --target-arch x86_64 \
            --name "FeiCai" \
            --add-data "VERSION:." \
            --add-data "web_dist:web_dist" \
            --add-data "modules:modules" \
            --hidden-import "desktop.server" \
            --hidden-import "desktop.logger" \
            --hidden-import "desktop.loader" \
            --hidden-import "desktop.update_checker" \
            --hidden-import "webview.platforms.cocoa" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --collect-all "webview" \
            desktop/main.py
      - name: Upload Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeiCai-mac-intel
          path: dist/FeiCai

  merge-mac-universal:
    needs: [build-mac-arm, build-mac-intel]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FeiCai-mac-arm64
          path: build/
      - uses: actions/download-artifact@v4
        with:
          name: FeiCai-mac-intel
          path: build/
      - name: Create universal binary with lipo
        run: |
          lipo -create -output FeiCai build/FeiCai build/FeiCai
          lipo -info FeiCai
      - name: Upload universal binary
        uses: actions/upload-artifact@v4
        with:
          name: FeiCai-mac
          path: FeiCai

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        shell: pwsh
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "FeiCai" `
            --add-data "VERSION;." `
            --add-data "web_dist;web_dist" `
            --add-data "modules;modules" `
            --hidden-import desktop.server `
            --hidden-import desktop.logger `
            --hidden-import desktop.loader `
            --hidden-import desktop.update_checker `
            --hidden-import webview.platforms.win32 `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --collect-all webview `
            desktop/main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeiCai-win
          path: dist/FeiCai.exe

  release:
    needs: [build-linux, merge-mac-universal, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FeiCai-linux
          path: release/linux/
      - uses: actions/download-artifact@v4
        with:
          name: FeiCai-mac
          path: release/mac/
      - uses: actions/download-artifact@v4
        with:
          name: FeiCai-win
          path: release/win/
      - name: Rename for release
        run: |
          mkdir -p upload
          cp release/linux/FeiCai upload/FeiCai-linux
          cp release/mac/FeiCai upload/FeiCai-mac
          cp release/win/FeiCai.exe upload/FeiCai-win.exe
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true